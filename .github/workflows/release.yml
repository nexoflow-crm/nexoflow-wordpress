name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check plugin version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header="$(grep -E '^\s*\*\s*Version:' nexoflow/nexoflow.php | awk '{print $NF}')"
          stable="$(grep -E '^Stable tag:' nexoflow/readme.txt | awk '{print $NF}')"
          test -n "$header"
          test "$header" = "$tag"
          test "$stable" = "$tag"

      - name: Run tests
        run: make test

      - name: Build plugin zip
        run: make zip

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" nexoflow.zip --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" nexoflow.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
